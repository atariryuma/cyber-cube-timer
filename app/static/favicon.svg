<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0a0e27" rx="15"/>

  <!-- Cube -->
  <g transform="translate(50, 50)">
    <!-- Top face -->
    <polygon points="-20,-15 0,-25 20,-15 0,-5" fill="#ffffff" opacity="0.9"/>

    <!-- Left face -->
    <polygon points="-20,-15 -20,15 0,25 0,-5" fill="url(#grad)" opacity="0.8"/>

    <!-- Right face -->
    <polygon points="20,-15 20,15 0,25 0,-5" fill="#ff00ff" opacity="0.7"/>

    <!-- Grid lines -->
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#0a0e27" stroke-width="1.5"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#0a0e27" stroke-width="1.5"/>
    <line x1="-7" y1="-18" x2="-7" y2="22" stroke="#0a0e27" stroke-width="1.5"/>
    <line x1="7" y1="-18" x2="7" y2="22" stroke="#0a0e27" stroke-width="1.5"/>
  </g>

  <!-- Glow effect -->
  <rect width="100" height="100" fill="none" stroke="#00f5ff" stroke-width="2" rx="15" opacity="0.5"/>
</svg>
