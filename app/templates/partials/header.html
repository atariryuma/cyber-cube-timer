<!-- Header Navigation - Session selector, cube type, and controls -->
<!-- Lines 77-104 from original index.html -->
<header class="header">
    <div class="header-content">
        <div class="logo">
            <span class="logo-icon">🎮</span>
            <span class="logo-text">CYBER CUBE</span>
        </div>
        <nav class="nav">
            <div class="session-selector">
                <label for="session-select">SESSION</label>
                <select id="session-select" aria-label="セッションを選択">
                    <option value="default">Default Session</option>
                </select>
                <button id="new-session-btn" class="btn-icon"
                        title="New Session"
                        aria-label="新しいセッションを作成">+</button>
            </div>
            <div class="cube-type-selector">
                <label for="cube-type-select">CUBE</label>
                <select id="cube-type-select" aria-label="キューブのタイプを選択">
                    <option value="2x2x2">2x2x2</option>
                    <option value="3x3x3" selected>3x3x3</option>
                    <option value="4x4x4">4x4x4</option>
                </select>
            </div>
            <button id="return-to-title-btn"
                    title="Return to Title Screen"
                    aria-label="タイトル画面に戻る">🏠 MENU</button>
            <button id="settings-btn" class="btn-icon"
                    title="Settings"
                    aria-label="設定を開く">⚙️</button>
        </nav>
    </div>
</header>
