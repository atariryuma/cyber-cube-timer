<!-- Title Screen - Game-style main menu -->
<!-- Lines 25-68 from original index.html -->
<div id="title-screen">
    <!-- Animated Background -->
    <div class="title-bg-animation">
        <div class="title-bg-cube"></div>
        <div class="title-bg-cube"></div>
        <div class="title-bg-cube"></div>
    </div>

    <!-- Main Title -->
    <div class="title-main">
        <h1 class="title-logo">CYBER CUBE</h1>
        <div class="title-subtitle">SPEEDCUBING TIMER</div>
        <div class="title-version">v2.0 - ESPORTS EDITION</div>
    </div>

    <!-- Mode Selection Menu -->
    <div class="title-menu">
        <button class="title-mode-btn" id="btn-time-attack"
                aria-label="タイムアタックモード - シングルプレイで自己ベストを目指す">
            <span class="mode-btn-icon" aria-hidden="true">⏱️</span>
            <div class="mode-btn-text">
                <div class="mode-btn-title">TIME ATTACK</div>
                <div class="mode-btn-desc">シングルプレイ - 自己ベストを目指せ</div>
            </div>
        </button>

        <button class="title-mode-btn battle-mode" id="btn-battle-mode"
                aria-label="バトルモード - CPU対戦で5つの難易度に挑戦">
            <span class="mode-btn-icon" aria-hidden="true">⚔️</span>
            <div class="mode-btn-text">
                <div class="mode-btn-title">BATTLE MODE</div>
                <div class="mode-btn-desc">CPU対戦 - 5つの難易度に挑戦</div>
            </div>
        </button>
    </div>

    <!-- Footer -->
    <div class="title-footer">
        <div>© 2025 CYBER CUBE TIMER - Built with Three.js & Flask</div>
        <div class="title-footer-links">
            <a href="#" class="title-footer-link" id="title-settings"
               aria-label="設定を開く">⚙️ SETTINGS</a>
            <a href="#" class="title-footer-link" id="title-help"
               aria-label="ヘルプを表示">❓ HELP</a>
        </div>
    </div>
</div>
