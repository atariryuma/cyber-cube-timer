<!-- Time Attack Mode - Single player practice mode -->
<!-- Lines 106-309 from original index.html -->
<div id="normal-mode-container">
<!-- Main Container - 16:9 Optimized Layout -->
<main class="main-container">
    <!-- Left Panel: 3D Cube Visualizer -->
    <aside class="left-panel">
        <div class="panel-header-compact">
            <span class="panel-title">SCRAMBLE</span>
            <div class="header-actions">
                <button id="scramble-help-btn" class="btn-icon-small"
                        title="Help"
                        aria-label="スクランブルヘルプを表示">?</button>
                <button id="refresh-scramble-btn" class="btn-icon-small"
                        title="New"
                        aria-label="新しいスクランブルを生成">↻</button>
            </div>
        </div>

        <!-- 3D Cube Visualizer -->
        <div id="cube-visualizer-container" class="cube-visualizer">
            <div id="cube-3d"></div>
        </div>

        <!-- Playback Controls -->
        <div class="playback-controls-compact">
            <div class="move-display-top">
                <span id="current-move-text" class="current-move">--</span>
                <span id="move-counter" class="move-counter">0 / 0</span>
            </div>
            <div class="control-buttons">
                <button id="scramble-restart" class="control-btn"
                        title="最初から"
                        aria-label="スクランブルを最初から再生">⏮</button>
                <button id="scramble-prev" class="control-btn"
                        title="1手戻る"
                        aria-label="1手戻る">◀</button>
                <button id="scramble-play" class="control-btn-play"
                        title="自動再生"
                        aria-label="スクランブルを自動再生">▶</button>
                <button id="scramble-next" class="control-btn"
                        title="1手進む"
                        aria-label="1手進む">▶</button>
                <button id="scramble-end" class="control-btn"
                        title="最後まで"
                        aria-label="スクランブルを最後まで進める">⏭</button>
            </div>
            <div class="speed-control">
                <select id="playback-speed" class="speed-select"
                        title="再生速度"
                        aria-label="スクランブル再生速度を選択">
                    <option value="2000">超スロー</option>
                    <option value="1000">スロー</option>
                    <option value="500" selected>普通</option>
                    <option value="250">速い</option>
                </select>
            </div>
        </div>

        <!-- Inline Notation Guide (Collapsible) -->
        <details class="inline-guide-collapsible">
            <summary class="guide-summary">📖 記号ガイド</summary>
            <div class="guide-content">
                <div class="orientation-box-mini">
                    <strong>🧭 持ち方:</strong> 白上・緑手前
                </div>
                <div class="notation-compact-grid">
                    <span class="notation-compact" title="Right - 右面を時計回り">R</span>
                    <span class="notation-compact" title="Left - 左面を時計回り">L</span>
                    <span class="notation-compact" title="Up - 上面を時計回り">U</span>
                    <span class="notation-compact" title="Down - 下面を時計回り">D</span>
                    <span class="notation-compact" title="Front - 手前面を時計回り">F</span>
                    <span class="notation-compact" title="Back - 奥面を時計回り">B</span>
                </div>
                <div class="guide-hint-compact">
                    <strong>'</strong>反時計 <strong>2</strong>180°
                </div>
            </div>
        </details>
    </aside>

    <!-- Center Panel: Timer -->
    <section class="center-panel">
        <!-- Camera Recording Section -->
        <div class="camera-section" id="camera-section">
            <video id="camera-preview" autoplay playsinline muted></video>
            <div class="camera-controls">
                <button id="camera-toggle" class="camera-btn">
                    <span id="camera-icon">📷</span>
                    <span id="camera-status">カメラON</span>
                </button>
                <span id="recording-indicator" class="recording-indicator" style="display: none;">● REC</span>
            </div>
        </div>

        <!-- Scramble Text Display -->
        <div class="scramble-display-center">
            <div class="scramble-label">SCRAMBLE</div>
            <div class="scramble-text-center" id="scramble-text-center">
                Loading scramble...
            </div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display" id="timer-display">
            <span class="timer-value">0.000</span>
        </div>
        <div class="timer-instruction" id="timer-instruction">
            <span class="pulse-text">PRESS SPACE</span>
        </div>
        <div class="inspection-timer" id="inspection-timer" style="display: none;">
            <span class="inspection-value">15</span>
        </div>

        <!-- Timer Action Buttons -->
        <div class="timer-actions" id="timer-actions">
            <button id="btn-timer-dnf" class="btn-timer-action"
                    title="最後のタイムをDNFにする"
                    aria-label="最後のタイムをDNF（未完成）にする">
                <span class="btn-icon-text">DNF</span>
            </button>
            <button id="btn-timer-plus2" class="btn-timer-action"
                    title="最後のタイムに+2秒ペナルティ"
                    aria-label="最後のタイムに2秒ペナルティを追加">
                <span class="btn-icon-text">+2</span>
            </button>
            <button id="btn-delete-last" class="btn-timer-action btn-danger"
                    title="最後のタイムを削除"
                    aria-label="最後のタイムを削除">
                <span class="btn-icon-text">DELETE</span>
            </button>
        </div>

        <!-- Quick Stats -->
        <div class="quick-stats">
            <div class="quick-stat" title="個人ベスト（Personal Best）">
                <span class="quick-stat-label">BEST</span>
                <span class="quick-stat-value" id="quick-stat-best">--</span>
            </div>
            <div class="quick-stat-divider"></div>
            <div class="quick-stat" title="5回の平均（最速・最遅を除く3回）">
                <span class="quick-stat-label">Ao5</span>
                <span class="quick-stat-value" id="quick-stat-ao5">--</span>
            </div>
            <div class="quick-stat-divider"></div>
            <div class="quick-stat" title="12回の平均（最速・最遅を除く10回）">
                <span class="quick-stat-label">Ao12</span>
                <span class="quick-stat-value" id="quick-stat-ao12">--</span>
            </div>
        </div>

        <!-- Quick Tips -->
        <div class="quick-tips" id="quick-tips">
            <div class="tip-carousel">
                <span class="tip-icon">💡</span>
                <span class="tip-text">スペースキーでタイマー開始・停止</span>
            </div>
        </div>
    </section>

    <!-- Right Panel: Statistics & History -->
    <aside class="right-panel">
        <!-- Statistics -->
        <div class="stats-compact">
            <div class="panel-header-compact">
                <span class="panel-title">STATS</span>
                <button class="btn-icon-small info-btn" id="stats-info-btn"
                        title="統計の見方"
                        aria-label="統計の見方を表示">ℹ️</button>
            </div>
            <div class="stats-grid">
                <div class="stat-item stat-highlight" title="これまでの最速記録">
                    <div class="stat-label">BEST</div>
                    <div class="stat-value" id="stat-single">--</div>
                </div>
                <div class="stat-item" title="直近5回の平均（最速・最遅除く）">
                    <div class="stat-label">Ao5</div>
                    <div class="stat-value" id="stat-ao5">--</div>
                </div>
                <div class="stat-item" title="直近12回の平均（最速・最遅除く）">
                    <div class="stat-label">Ao12</div>
                    <div class="stat-value" id="stat-ao12">--</div>
                </div>
                <div class="stat-item" title="記録した回数">
                    <div class="stat-label">SOLVES</div>
                    <div class="stat-value" id="stat-count">0</div>
                </div>
            </div>
        </div>

        <!-- Time Graph -->
        <div class="graph-compact">
            <div class="panel-header-compact">
                <span class="panel-title">GRAPH</span>
            </div>
            <div class="graph-container-compact">
                <canvas id="time-chart"></canvas>
            </div>
        </div>

        <!-- History -->
        <div class="history-compact">
            <div class="panel-header-compact">
                <span class="panel-title">HISTORY</span>
                <div class="header-actions">
                    <button id="export-csv-btn" class="btn-icon-small"
                            title="CSVでバックアップ"
                            aria-label="履歴をCSVファイルでエクスポート">📥</button>
                    <button id="clear-history-btn" class="btn-icon-small"
                            title="全削除"
                            aria-label="すべての履歴を削除">🗑️</button>
                </div>
            </div>
            <div class="history-list-compact" id="history-list">
                <div class="history-empty">
                    <p>📊 まだ記録がありません</p>
                    <p class="hint-text">スペースキーでタイマー開始！</p>
                    <div class="penalty-guide">
                        <div class="penalty-item">
                            <span class="penalty-btn">+2</span>
                            <span class="penalty-desc">2秒ペナルティ</span>
                        </div>
                        <div class="penalty-item">
                            <span class="penalty-btn">DNF</span>
                            <span class="penalty-desc">未完成</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </aside>
</main>
</div>
<!-- End Normal Mode Container -->
