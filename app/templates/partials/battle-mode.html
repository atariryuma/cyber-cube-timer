<!-- Battle Mode - VS CPU Battle -->
<div id="battle-mode-container">
    <!-- Opponent Selection Screen -->
    <div id="battle-opponent-select">
        <!-- Content dynamically generated by battle-mode.js -->
    </div>

    <!-- Battle Screen -->
    <div id="battle-race-screen">
        <div class="battle-container">
            <!-- Left Panel: Player -->
            <div class="battle-left-panel">
                <div class="panel-header">
                    <span class="panel-title">YOU</span>
                </div>

                <!-- Player Camera -->
                <div class="battle-camera-section">
                    <video id="battle-camera-preview" autoplay playsinline muted></video>
                    <div class="camera-label">LIVE</div>

                    <!-- Inspection Overlay -->
                    <div class="inspection-overlay" id="battle-inspection-overlay">
                        <div class="inspection-timer" id="battle-inspection-timer">15</div>
                        <div class="inspection-label">INSPECTION</div>
                    </div>
                </div>

                <!-- Player Stats -->
                <div class="battle-stats">
                    <div class="stat-row">
                        <span class="stat-label">TIME</span>
                        <span class="stat-value" id="player-time-display">0.000</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">WINS</span>
                        <span class="stat-value" id="player-wins">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">LOSSES</span>
                        <span class="stat-value" id="player-losses">0</span>
                    </div>
                </div>
            </div>

            <!-- Center Panel: Timer & Controls -->
            <div class="battle-center-panel">
                <!-- VS Header -->
                <div class="vs-header">
                    <span class="vs-text">⚔️ VS</span>
                    <span class="opponent-name" id="top-opponent-name">BRONZE</span>
                </div>

                <!-- Main Timer -->
                <div class="battle-timer-section">
                    <div class="battle-timer" id="battle-timer-value">0.000</div>
                    <div class="timer-instruction" id="battle-timer-instruction">
                        <span class="pulse-text">PRESS SPACE</span>
                    </div>
                </div>

                <!-- Scramble Display -->
                <div class="battle-scramble-section">
                    <div class="scramble-label">SCRAMBLE</div>
                    <div class="scramble-text" id="battle-scramble-text">Loading...</div>
                    <div class="scramble-actions">
                        <button class="btn-scramble" id="btn-show-scramble-steps">
                            <span>👁️ STEPS</span>
                        </button>
                        <button class="btn-scramble" id="btn-battle-new-scramble">
                            <span>↻ NEW</span>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="battle-actions">
                    <button id="btn-battle-back" class="btn-action">◄ BACK</button>
                    <button id="btn-change-opponent-ready" class="btn-action">CHANGE</button>
                    <button id="btn-give-up" class="btn-action btn-danger" style="display:none;">GIVE UP</button>
                    <button id="btn-battle-settings" class="btn-action">⚙️</button>
                </div>
            </div>

            <!-- Right Panel: CPU -->
            <div class="battle-right-panel">
                <div class="panel-header">
                    <span class="panel-title" id="top-cpu-name">CPU</span>
                </div>

                <!-- CPU 3D Cube -->
                <div class="battle-cube-section">
                    <div id="cpu-cube-3d"></div>
                    <div class="cube-label">
                        <span id="cpu-icon-display">🤖</span>
                        <span id="cpu-rank-label">BRONZE</span>
                    </div>
                </div>

                <!-- CPU Stats -->
                <div class="battle-stats">
                    <div class="stat-row">
                        <span class="stat-label">TIME</span>
                        <span class="stat-value" id="cpu-time-display">0.000</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">RANK</span>
                        <span class="stat-value" id="cpu-rank-display">BRONZE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scramble Steps Modal -->
    <div class="battle-modal" id="battle-scramble-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Scramble Steps</h3>
                <button class="btn-close" id="btn-close-scramble-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="scramble-3d-container" id="battle-scramble-3d"></div>
                <div class="scramble-controls">
                    <button id="battle-scramble-restart">⏮️</button>
                    <button id="battle-scramble-prev">⏪</button>
                    <button id="battle-scramble-play">▶️</button>
                    <button id="battle-scramble-next">⏩</button>
                    <button id="battle-scramble-end">⏭️</button>
                </div>
            </div>
        </div>
    </div>
</div>
